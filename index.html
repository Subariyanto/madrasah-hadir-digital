<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madrasah Hadir Digital</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
tailwind.config={theme:{extend:{colors:{primary:'#16a34a',primaryDark:'#15803d',primaryLight:'#bbf7d0'}}}}
</script>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f0fdf4}
.sidebar{width:260px;background:#15803d;min-height:100vh;position:fixed;left:0;top:0;z-index:50;transition:transform .3s}
.sidebar.hidden-mobile{transform:translateX(-260px)}
.sidebar a,.sidebar button{display:flex;align-items:center;gap:8px;padding:10px 16px;color:#fff;text-decoration:none;border:none;background:none;width:100%;text-align:left;cursor:pointer;font-size:14px;border-radius:6px;margin:2px 8px}
.sidebar a:hover,.sidebar button:hover{background:rgba(255,255,255,.15)}
.sidebar a.active{background:rgba(255,255,255,.25);font-weight:600}
.main{margin-left:260px;padding:20px;min-height:100vh}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:500}
.btn-primary{background:#16a34a;color:#fff}.btn-primary:hover{background:#15803d}
.btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-secondary{background:#e5e7eb;color:#374151}.btn-secondary:hover{background:#d1d5db}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #e5e7eb;font-size:13px}
th{background:#f0fdf4;font-weight:600;color:#15803d}
input,select{padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;width:100%}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto}
.stat-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.1);text-align:center}
.stat-card .num{font-size:28px;font-weight:700;color:#15803d}
.stat-card .label{font-size:12px;color:#6b7280;margin-top:4px}
.badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge-hadir{background:#bbf7d0;color:#166534}
.badge-sakit{background:#fef3c7;color:#92400e}
.badge-izin{background:#dbeafe;color:#1e40af}
.badge-alpha{background:#fecaca;color:#991b1b}
@media(max-width:768px){.sidebar{transform:translateX(-260px)}.sidebar.show-mobile{transform:translateX(0)}.main{margin-left:0;padding:12px}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
<div style="padding:16px;border-bottom:1px solid rgba(255,255,255,.2)">
<h2 style="color:#fff;font-size:16px;margin:0" id="appTitle">Madrasah Hadir Digital</h2>
<p style="color:#bbf7d0;font-size:11px;margin:4px 0 0">Sistem Presensi</p>
</div>
<nav style="padding:8px 0">
<a href="#" onclick="nav('dashboard')" id="nav-dashboard" class="active">📊 Dashboard</a>
<a href="#" onclick="nav('presensi')" id="nav-presensi">✅ Presensi Manual</a>
<a href="#" onclick="nav('scan')" id="nav-scan">📷 Scan QR</a>
<a href="#" onclick="nav('siswa')" id="nav-siswa">👨‍🎓 Data Siswa</a>
<a href="#" onclick="nav('kelas')" id="nav-kelas">🏫 Data Kelas</a>
<a href="#" onclick="nav('kartu')" id="nav-kartu">🪪 Cetak Kartu QR</a>
<a href="#" onclick="nav('rekap')" id="nav-rekap">📋 Rekap Presensi</a>
<a href="#" onclick="nav('pengaturan')" id="nav-pengaturan">⚙️ Pengaturan</a>
<button onclick="logout()" style="margin-top:20px;color:#fecaca">🚪 Logout</button>
</nav>
</div>
<div class="main" id="mainContent">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
<button onclick="toggleSidebar()" style="display:none;background:none;border:none;font-size:24px;cursor:pointer" id="hamburger">☰</button>
<h1 style="font-size:20px;color:#15803d;margin:0" id="pageTitle">Dashboard</h1>
</div>
<div id="pageContent"></div>
</div>
<div id="loginScreen" style="display:none;position:fixed;inset:0;background:#f0fdf4;z-index:200;display:flex;align-items:center;justify-content:center">
<div class="card" style="max-width:360px;width:90%;text-align:center">
<h2 style="color:#15803d;margin-bottom:4px">🕌 Madrasah Hadir Digital</h2>
<p style="color:#6b7280;font-size:13px;margin-bottom:20px">Sistem Presensi Digital</p>
<input type="text" id="loginUser" placeholder="Username" style="margin-bottom:10px"><br>
<input type="password" id="loginPass" placeholder="Password" style="margin-bottom:16px"><br>
<button class="btn btn-primary" style="width:100%" onclick="doLogin()">Masuk</button>
<p id="loginError" style="color:#dc2626;font-size:12px;margin-top:8px;display:none">Username atau password salah</p>
</div>
</div>
<script>
// ===== DATA LAYER =====
const DB={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},

      {id:'s23',nama:'Arif Rahman',kelas:'k5',nisn:'0081234023'},

    const presensi=[];
    siswa.slice(0,20).forEach(s=>{
      presensi.push({siswaId:s.id,tanggal:today,status:'hadir',waktu:new Date().toLocaleTimeString('id-ID')});
    });
    siswa.slice(20,24).forEach(s=>{presensi.push({siswaId:s.id,tanggal:today,status:'sakit',waktu:''})});
    siswa.slice(24,27).forEach(s=>{presensi.push({siswaId:s.id,tanggal:today,status:'izin',waktu:''})});

// ===== AUTH =====
let loggedIn=false;
function checkAuth(){
  loggedIn=sessionStorage.getItem('loggedIn')==='true';
  document.getElementById('loginScreen').style.display=loggedIn?'none':'flex';
  if(loggedIn){initApp()}
}
function doLogin(){
  const u=document.getElementById('loginUser').value;
  const p=document.getElementById('loginPass').value;
  const cred=DB.get('credentials');
  if(u===cred.username&&p===cred.password){
    sessionStorage.setItem('loggedIn','true');loggedIn=true;
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('loginError').style.display='none';
    initApp();
  }else{document.getElementById('loginError').style.display='block'}
}
function logout(){sessionStorage.removeItem('loggedIn');location.reload()}

// ===== NAVIGATION =====
let currentPage='dashboard';
function nav(page){
  currentPage=page;
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
  const el=document.getElementById('nav-'+page);if(el)el.classList.add('active');
  const titles={dashboard:'Dashboard',presensi:'Presensi Manual',scan:'Scan QR',siswa:'Data Siswa',kelas:'Data Kelas',kartu:'Cetak Kartu QR',rekap:'Rekap Presensi',pengaturan:'Pengaturan'};
  document.getElementById('pageTitle').textContent=titles[page]||page;
  render();closeSidebarMobile();
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('show-mobile')}
function closeSidebarMobile(){document.getElementById('sidebar').classList.remove('show-mobile')}

// ===== RENDER =====
function render(){
  const c=document.getElementById('pageContent');
  switch(currentPage){
    case'dashboard':c.innerHTML=renderDashboard();break;
    case'presensi':c.innerHTML=renderPresensi();break;
    case'scan':c.innerHTML=renderScan();setTimeout(initScanner,100);break;
    case'siswa':c.innerHTML=renderSiswa();break;
    case'kelas':c.innerHTML=renderKelas();break;
    case'kartu':c.innerHTML=renderKartu();setTimeout(generateQRCards,100);break;
    case'rekap':c.innerHTML=renderRekap();break;
    case'pengaturan':c.innerHTML=renderPengaturan();break;
  }
}

// ===== DASHBOARD =====
function renderDashboard(){
  const siswa=DB.get('siswa')||[];
  const presensi=DB.get('presensi')||[];
  const today=new Date().toISOString().slice(0,10);
  const todayP=presensi.filter(p=>p.tanggal===today);
  const hadir=todayP.filter(p=>p.status==='hadir').length;
  const sakit=todayP.filter(p=>p.status==='sakit').length;
  const izin=todayP.filter(p=>p.status==='izin').length;
  const alpha=siswa.length-hadir-sakit-izin;
  const persen=siswa.length?Math.round(hadir/siswa.length*100):0;
  return `
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px">
    <div class="stat-card"><div class="num">${siswa.length}</div><div class="label">Total Siswa</div></div>
    <div class="stat-card"><div class="num" style="color:#16a34a">${hadir}</div><div class="label">Hadir</div></div>
    <div class="stat-card"><div class="num" style="color:#d97706">${sakit}</div><div class="label">Sakit</div></div>
    <div class="stat-card"><div class="num" style="color:#2563eb">${izin}</div><div class="label">Izin</div></div>
    <div class="stat-card"><div class="num" style="color:#dc2626">${alpha}</div><div class="label">Alpha</div></div>
    <div class="stat-card"><div class="num">${persen}%</div><div class="label">Kehadiran</div></div>
  </div>
  <div class="card"><h3 style="margin:0 0 12px;font-size:15px;color:#15803d">Presensi Hari Ini (${today})</h3>
  <div style="overflow-x:auto"><table><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Status</th><th>Waktu</th></tr>
  ${todayP.slice(0,15).map((p,i)=>{
    const s=(DB.get('siswa')||[]).find(x=>x.id===p.siswaId);
    const k=(DB.get('kelas')||[]).find(x=>x.id===(s?s.kelas:''));
    return `<tr><td>${i+1}</td><td>${s?s.nama:'-'}</td><td>${k?k.nama:'-'}</td><td><span class="badge badge-${p.status}">${p.status}</span></td><td>${p.waktu||'-'}</td></tr>`;
  }).join('')}
  ${todayP.length>15?`<tr><td colspan="5" style="text-align:center;color:#6b7280">... dan ${todayP.length-15} lainnya</td></tr>`:''}
  </table></div></div>`;
}

// ===== PRESENSI MANUAL =====
function renderPresensi(){
  const kelas=DB.get('kelas')||[];
  const today=new Date().toISOString().slice(0,10);
  return `<div class="card">
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    <select id="selKelas" onchange="loadPresensiKelas()" style="max-width:200px">${kelas.map(k=>`<option value="${k.id}">${k.nama}</option>`).join('')}</select>
    <input type="date" id="selTanggal" value="${today}" onchange="loadPresensiKelas()" style="max-width:180px">
    <button class="btn btn-primary" onclick="simpanPresensi()">💾 Simpan</button>
  </div>
  <div id="presensiList"></div></div>`;
}
function loadPresensiKelas(){
  const kelasId=document.getElementById('selKelas').value;
  const tanggal=document.getElementById('selTanggal').value;
  const siswa=(DB.get('siswa')||[]).filter(s=>s.kelas===kelasId);
  const presensi=DB.get('presensi')||[];
  let html='<table><tr><th>No</th><th>Nama</th><th>NISN</th><th>Status</th></tr>';
  siswa.forEach((s,i)=>{
    const existing=presensi.find(p=>p.siswaId===s.id&&p.tanggal===tanggal);
    const st=existing?existing.status:'hadir';
    html+=`<tr><td>${i+1}</td><td>${s.nama}</td><td>${s.nisn}</td><td>
    <select id="st-${s.id}" style="max-width:100px">
      <option value="hadir" ${st==='hadir'?'selected':''}>Hadir</option>
      <option value="sakit" ${st==='sakit'?'selected':''}>Sakit</option>
      <option value="izin" ${st==='izin'?'selected':''}>Izin</option>
      <option value="alpha" ${st==='alpha'?'selected':''}>Alpha</option>
    </select></td></tr>`;
  });
  html+='</table>';
  document.getElementById('presensiList').innerHTML=html;
}
function simpanPresensi(){
  const kelasId=document.getElementById('selKelas').value;
  const tanggal=document.getElementById('selTanggal').value;
  const siswa=(DB.get('siswa')||[]).filter(s=>s.kelas===kelasId);
  let presensi=DB.get('presensi')||[];
  siswa.forEach(s=>{
    const status=document.getElementById('st-'+s.id).value;
    const idx=presensi.findIndex(p=>p.siswaId===s.id&&p.tanggal===tanggal);
    const waktu=status==='hadir'?new Date().toLocaleTimeString('id-ID'):'';
    if(idx>=0){presensi[idx]={...presensi[idx],status,waktu}}
    else{presensi.push({siswaId:s.id,tanggal,status,waktu})}
  });
  DB.set('presensi',presensi);
  alert('Presensi berhasil disimpan!');
}

// ===== SCAN QR =====
let qrScanner=null;
function renderScan(){
  return `<div class="card">
  <p style="font-size:13px;color:#6b7280;margin-bottom:12px">Arahkan kamera ke kartu QR siswa untuk mencatat kehadiran otomatis.</p>
  <div id="qr-reader" style="width:100%;max-width:400px;margin:0 auto"></div>
  <div id="scanResult" style="margin-top:12px;text-align:center"></div>
  <div id="scanLog" style="margin-top:16px"><h4 style="font-size:14px;color:#15803d">Log Scan Hari Ini</h4><div id="scanLogList"></div></div>
  </div>`;
}
function initScanner(){
  const el=document.getElementById('qr-reader');
  if(!el)return;
  if(qrScanner){qrScanner.clear();qrScanner=null}
  qrScanner=new Html5QrcodeScanner("qr-reader",{fps:10,qrbox:250});
  qrScanner.render(onScanSuccess,()=>{});
  updateScanLog();
}
function onScanSuccess(decoded){
  const siswa=(DB.get('siswa')||[]).find(s=>s.id===decoded||s.nisn===decoded);
  const res=document.getElementById('scanResult');
  if(!siswa){res.innerHTML='<p style="color:#dc2626">❌ Siswa tidak ditemukan: '+decoded+'</p>';return}
  const today=new Date().toISOString().slice(0,10);
  let presensi=DB.get('presensi')||[];
  const existing=presensi.find(p=>p.siswaId===siswa.id&&p.tanggal===today);
  if(existing){res.innerHTML=`<p style="color:#d97706">⚠️ ${siswa.nama} sudah tercatat hadir hari ini</p>`;return}
  presensi.push({siswaId:siswa.id,tanggal:today,status:'hadir',waktu:new Date().toLocaleTimeString('id-ID')});
  DB.set('presensi',presensi);
  res.innerHTML=`<p style="color:#16a34a">✅ ${siswa.nama} - Hadir (${new Date().toLocaleTimeString('id-ID')})</p>`;
  updateScanLog();
}
function updateScanLog(){
  const today=new Date().toISOString().slice(0,10);
  const presensi=(DB.get('presensi')||[]).filter(p=>p.tanggal===today&&p.status==='hadir');
  const siswa=DB.get('siswa')||[];
  const el=document.getElementById('scanLogList');
  if(!el)return;
  el.innerHTML=presensi.slice(-10).reverse().map(p=>{
    const s=siswa.find(x=>x.id===p.siswaId);
    return `<div style="padding:4px 0;font-size:13px;border-bottom:1px solid #e5e7eb">${s?s.nama:'?'} - ${p.waktu}</div>`;
  }).join('')||'<p style="color:#6b7280;font-size:13px">Belum ada scan hari ini</p>';
}

// ===== DATA SISWA =====
function renderSiswa(){
  const siswa=DB.get('siswa')||[];
  const kelas=DB.get('kelas')||[];
  return `<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <span style="font-size:13px;color:#6b7280">Total: ${siswa.length} siswa</span>
    <button class="btn btn-primary" onclick="showAddSiswa()">+ Tambah Siswa</button>
  </div>
  <div style="overflow-x:auto"><table><tr><th>No</th><th>Nama</th><th>NISN</th><th>Kelas</th><th>Aksi</th></tr>
  ${siswa.map((s,i)=>{
    const k=kelas.find(x=>x.id===s.kelas);
    return `<tr><td>${i+1}</td><td>${s.nama}</td><td>${s.nisn}</td><td>${k?k.nama:'-'}</td><td>
    <button class="btn btn-secondary" onclick="editSiswa('${s.id}')" style="padding:4px 8px;font-size:12px">✏️</button>
    <button class="btn btn-danger" onclick="hapusSiswa('${s.id}')" style="padding:4px 8px;font-size:12px">🗑️</button></td></tr>`;
  }).join('')}</table></div></div>`;
}
function showAddSiswa(editId){
  const siswa=DB.get('siswa')||[];
  const kelas=DB.get('kelas')||[];
  const s=editId?siswa.find(x=>x.id===editId):null;
  const html=`<div class="overlay" onclick="if(event.target===this)this.remove()"><div class="modal">
  <h3 style="margin:0 0 16px;color:#15803d">${s?'Edit':'Tambah'} Siswa</h3>
  <label style="font-size:13px;color:#374151">Nama</label>
  <input id="fNama" value="${s?s.nama:''}" style="margin-bottom:10px">
  <label style="font-size:13px;color:#374151">NISN</label>
  <input id="fNisn" value="${s?s.nisn:''}" style="margin-bottom:10px">
  <label style="font-size:13px;color:#374151">Kelas</label>
  <select id="fKelas" style="margin-bottom:16px">${kelas.map(k=>`<option value="${k.id}" ${s&&s.kelas===k.id?'selected':''}>${k.nama}</option>`).join('')}</select>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn btn-secondary" onclick="this.closest('.overlay').remove()">Batal</button>
    <button class="btn btn-primary" onclick="saveSiswa('${editId||''}')">${s?'Update':'Simpan'}</button>
  </div></div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
function editSiswa(id){showAddSiswa(id)}
function saveSiswa(editId){
  const nama=document.getElementById('fNama').value.trim();
  const nisn=document.getElementById('fNisn').value.trim();
  const kelas=document.getElementById('fKelas').value;
  if(!nama){alert('Nama harus diisi');return}
  let siswa=DB.get('siswa')||[];
  if(editId){
    siswa=siswa.map(s=>s.id===editId?{...s,nama,nisn,kelas}:s);
  }else{
    siswa.push({id:'s'+Date.now(),nama,nisn,kelas});
  }
  DB.set('siswa',siswa);
  document.querySelector('.overlay').remove();
  render();
}
function hapusSiswa(id){
  if(!confirm('Hapus siswa ini?'))return;
  DB.set('siswa',(DB.get('siswa')||[]).filter(s=>s.id!==id));
  render();
}

// ===== DATA KELAS =====
function renderKelas(){
  const kelas=DB.get('kelas')||[];
  const siswa=DB.get('siswa')||[];
  return `<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <span style="font-size:13px;color:#6b7280">Total: ${kelas.length} kelas</span>
    <button class="btn btn-primary" onclick="showAddKelas()">+ Tambah Kelas</button>
  </div>
  <div style="overflow-x:auto"><table><tr><th>No</th><th>Nama Kelas</th><th>Jumlah Siswa</th><th>Aksi</th></tr>
  ${kelas.map((k,i)=>{
    const jml=siswa.filter(s=>s.kelas===k.id).length;
    return `<tr><td>${i+1}</td><td>${k.nama}</td><td>${jml}</td><td>
    <button class="btn btn-secondary" onclick="editKelas('${k.id}')" style="padding:4px 8px;font-size:12px">✏️</button>
    <button class="btn btn-danger" onclick="hapusKelas('${k.id}')" style="padding:4px 8px;font-size:12px">🗑️</button></td></tr>`;
  }).join('')}</table></div></div>`;
}
function showAddKelas(editId){
  const kelas=DB.get('kelas')||[];
  const k=editId?kelas.find(x=>x.id===editId):null;
  const html=`<div class="overlay" onclick="if(event.target===this)this.remove()"><div class="modal">
  <h3 style="margin:0 0 16px;color:#15803d">${k?'Edit':'Tambah'} Kelas</h3>
  <label style="font-size:13px;color:#374151">Nama Kelas</label>
  <input id="fKelasNama" value="${k?k.nama:''}" style="margin-bottom:16px">
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn btn-secondary" onclick="this.closest('.overlay').remove()">Batal</button>
    <button class="btn btn-primary" onclick="saveKelas('${editId||''}')">${k?'Update':'Simpan'}</button>
  </div></div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
function editKelas(id){showAddKelas(id)}
function saveKelas(editId){
  const nama=document.getElementById('fKelasNama').value.trim();
  if(!nama){alert('Nama kelas harus diisi');return}
  let kelas=DB.get('kelas')||[];
  if(editId){kelas=kelas.map(k=>k.id===editId?{...k,nama}:k)}
  else{kelas.push({id:'k'+Date.now(),nama})}
  DB.set('kelas',kelas);
  document.querySelector('.overlay').remove();render();
}
function hapusKelas(id){
  if(!confirm('Hapus kelas ini? Siswa di kelas ini tidak akan terhapus.'))return;
  DB.set('kelas',(DB.get('kelas')||[]).filter(k=>k.id!==id));render();
}

// ===== CETAK KARTU QR =====
function renderKartu(){
  const kelas=DB.get('kelas')||[];
  return `<div class="card">
  <div style="margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <select id="kartuKelas" style="max-width:200px">
      <option value="all">Semua Kelas</option>
      ${kelas.map(k=>`<option value="${k.id}">${k.nama}</option>`).join('')}
    </select>
    <button class="btn btn-primary" onclick="generateQRCards()">🔄 Generate</button>
    <button class="btn btn-secondary" onclick="printCards()">🖨️ Cetak</button>
  </div>
  <div id="qrCards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px"></div>
  </div>`;
}
function generateQRCards(){
  const kelasFilter=document.getElementById('kartuKelas')?document.getElementById('kartuKelas').value:'all';
  let siswa=DB.get('siswa')||[];
  const kelas=DB.get('kelas')||[];
  if(kelasFilter!=='all')siswa=siswa.filter(s=>s.kelas===kelasFilter);
  const container=document.getElementById('qrCards');
  if(!container)return;
  const settings=DB.get('settings')||{};
  container.innerHTML=siswa.map(s=>{
    const k=kelas.find(x=>x.id===s.kelas);
    return `<div style="border:1px solid #d1d5db;border-radius:8px;padding:12px;text-align:center;background:#fff">
    <p style="font-size:11px;color:#15803d;font-weight:600;margin:0 0 4px">${settings.namaSekolah||'Madrasah'}</p>
    <div id="qr-${s.id}" style="display:inline-block;margin:8px 0"></div>
    <p style="font-size:13px;font-weight:600;margin:4px 0 0">${s.nama}</p>
    <p style="font-size:11px;color:#6b7280;margin:2px 0">${k?k.nama:''} | ${s.nisn}</p>
    </div>`;
  }).join('');
  siswa.forEach(s=>{
    const el=document.getElementById('qr-'+s.id);
    if(el){el.innerHTML='';new QRCode(el,{text:s.id,width:100,height:100})}
  });
}
function printCards(){window.print()}

// ===== REKAP PRESENSI =====
function renderRekap(){
  const kelas=DB.get('kelas')||[];
  const today=new Date().toISOString().slice(0,10);
  const month=today.slice(0,7);
  return `<div class="card">
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
    <select id="rekapKelas" style="max-width:180px">
      <option value="all">Semua Kelas</option>
      ${kelas.map(k=>`<option value="${k.id}">${k.nama}</option>`).join('')}
    </select>
    <input type="month" id="rekapBulan" value="${month}" style="max-width:180px">
    <button class="btn btn-primary" onclick="loadRekap()">🔍 Tampilkan</button>
    <button class="btn btn-secondary" onclick="exportRekapPDF()">📄 Export PDF</button>
  </div>
  <div id="rekapTable"></div></div>`;
}
function loadRekap(){
  const kelasId=document.getElementById('rekapKelas').value;
  const bulan=document.getElementById('rekapBulan').value;
  let siswa=DB.get('siswa')||[];
  const kelas=DB.get('kelas')||[];
  const presensi=DB.get('presensi')||[];
  if(kelasId!=='all')siswa=siswa.filter(s=>s.kelas===kelasId);
  const filtered=presensi.filter(p=>p.tanggal.startsWith(bulan));
  let html='<div style="overflow-x:auto"><table><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alpha</th><th>%</th></tr>';
  siswa.forEach((s,i)=>{
    const sp=filtered.filter(p=>p.siswaId===s.id);
    const h=sp.filter(p=>p.status==='hadir').length;
    const sk=sp.filter(p=>p.status==='sakit').length;
    const iz=sp.filter(p=>p.status==='izin').length;
    const al=sp.filter(p=>p.status==='alpha').length;
    const total=h+sk+iz+al;
    const persen=total?Math.round(h/total*100):0;
    const k=kelas.find(x=>x.id===s.kelas);
    html+=`<tr><td>${i+1}</td><td>${s.nama}</td><td>${k?k.nama:'-'}</td><td>${h}</td><td>${sk}</td><td>${iz}</td><td>${al}</td><td>${persen}%</td></tr>`;
  });
  html+='</table></div>';
  document.getElementById('rekapTable').innerHTML=html;
}
function exportRekapPDF(){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF();
  const settings=DB.get('settings')||{};
  doc.setFontSize(14);doc.text(settings.namaSekolah||'Madrasah',14,20);
  doc.setFontSize(11);doc.text('Rekap Presensi - '+document.getElementById('rekapBulan').value,14,28);
  const kelasId=document.getElementById('rekapKelas').value;
  const bulan=document.getElementById('rekapBulan').value;
  let siswa=DB.get('siswa')||[];
  const kelas=DB.get('kelas')||[];
  const presensi=DB.get('presensi')||[];
  if(kelasId!=='all')siswa=siswa.filter(s=>s.kelas===kelasId);
  const filtered=presensi.filter(p=>p.tanggal.startsWith(bulan));
  const rows=siswa.map((s,i)=>{
    const sp=filtered.filter(p=>p.siswaId===s.id);
    const h=sp.filter(p=>p.status==='hadir').length;
    const sk=sp.filter(p=>p.status==='sakit').length;
    const iz=sp.filter(p=>p.status==='izin').length;
    const al=sp.filter(p=>p.status==='alpha').length;
    const total=h+sk+iz+al;const persen=total?Math.round(h/total*100):0;
    const k=kelas.find(x=>x.id===s.kelas);
    return[i+1,s.nama,k?k.nama:'-',h,sk,iz,al,persen+'%'];
  });
  doc.autoTable({startY:34,head:[['No','Nama','Kelas','Hadir','Sakit','Izin','Alpha','%']],body:rows,styles:{fontSize:9}});
  doc.save('rekap-presensi-'+bulan+'.pdf');
}

// ===== PENGATURAN =====
function renderPengaturan(){
  const settings=DB.get('settings')||{};
  const cred=DB.get('credentials')||{};
  return `<div class="card">
  <h3 style="margin:0 0 16px;font-size:15px;color:#15803d">Profil Madrasah</h3>
  <label style="font-size:13px;color:#374151">Nama Madrasah</label>
  <input id="setNama" value="${settings.namaSekolah||''}" style="margin-bottom:10px">
  <label style="font-size:13px;color:#374151">Alamat</label>
  <input id="setAlamat" value="${settings.alamat||''}" style="margin-bottom:16px">
  <button class="btn btn-primary" onclick="saveSettings()">💾 Simpan Profil</button>
  <hr style="margin:20px 0;border-color:#e5e7eb">
  <h3 style="margin:0 0 16px;font-size:15px;color:#15803d">Ubah Password</h3>
  <label style="font-size:13px;color:#374151">Username</label>
  <input id="setUser" value="${cred.username||''}" style="margin-bottom:10px">
  <label style="font-size:13px;color:#374151">Password Baru</label>
  <input type="password" id="setPass" placeholder="Kosongkan jika tidak diubah" style="margin-bottom:16px">
  <button class="btn btn-primary" onclick="saveCredentials()">🔑 Ubah Login</button>
  <hr style="margin:20px 0;border-color:#e5e7eb">
  <h3 style="margin:0 0 16px;font-size:15px;color:#dc2626">Reset Data</h3>
  <p style="font-size:13px;color:#6b7280;margin-bottom:10px">Hapus semua data dan kembalikan ke data awal.</p>
  <button class="btn btn-danger" onclick="resetData()">🗑️ Reset Semua Data</button>
  </div>`;
}
function saveSettings(){
  const settings=DB.get('settings')||{};
  settings.namaSekolah=document.getElementById('setNama').value.trim();
  settings.alamat=document.getElementById('setAlamat').value.trim();
  DB.set('settings',settings);
  document.getElementById('appTitle').textContent=settings.namaSekolah||'Madrasah Hadir Digital';
  alert('Profil berhasil disimpan!');
}
function saveCredentials(){
  const username=document.getElementById('setUser').value.trim();
  const password=document.getElementById('setPass').value;
  if(!username){alert('Username harus diisi');return}
  const cred=DB.get('credentials')||{};
  cred.username=username;
  if(password)cred.password=password;
  DB.set('credentials',cred);
  alert('Login berhasil diubah!');
}
function resetData(){
  if(!confirm('YAKIN hapus semua data? Tidak bisa dikembalikan!'))return;
  localStorage.clear();initData();render();alert('Data berhasil direset.');
}

// ===== INIT =====
function initApp(){
  const settings=DB.get('settings')||{};
  document.getElementById('appTitle').textContent=settings.namaSekolah||'Madrasah Hadir Digital';
  // responsive
  if(window.innerWidth<=768){document.getElementById('hamburger').style.display='block'}
  window.addEventListener('resize',()=>{
    document.getElementById('hamburger').style.display=window.innerWidth<=768?'block':'none';
    if(window.innerWidth>768)document.getElementById('sidebar').classList.remove('show-mobile');
  });
  nav('dashboard');
  setTimeout(()=>{if(currentPage==='presensi')loadPresensiKelas()},100);
}

// Boot
initData();checkAuth();
</script>
